name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create release draft
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build-backend:
    name: Build ${{ matrix.platform }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
            archive: tar.gz
            binary: owl-server
          - os: ubuntu-latest
            platform: linux-arm64
            goos: linux
            goarch: arm64
            archive: tar.gz
            binary: owl-server
          - os: ubuntu-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
            archive: zip
            binary: owl-server.exe
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
            archive: tar.gz
            binary: owl-server
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
            archive: tar.gz
            binary: owl-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build embedded frontend assets
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Test backend
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: backend
        env:
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: off
        run: go test ./...

      - name: Build embedded backend binary
        shell: bash
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: off
        run: |
          mkdir -p ../dist
          go build -trimpath \
            -ldflags="-s -w -X 'owl/backend/pkg/version.Version=${{ github.ref_name }}' -X 'owl/backend/pkg/version.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')' -X 'owl/backend/pkg/version.GitCommit=${{ github.sha }}'" \
            -o "../dist/${{ matrix.binary }}" ./cmd/server

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            zip "owl-${{ matrix.platform }}.zip" "${{ matrix.binary }}"
          else
            tar czf "owl-${{ matrix.platform }}.tar.gz" "${{ matrix.binary }}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-${{ matrix.platform }}
          path: |
            dist/owl-${{ matrix.platform }}.*
          retention-days: 7

  build-desktop:
    name: Build desktop ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux_x64 }
          - { os: ubuntu-latest, target: linux_arm64 }
          - { os: windows-latest, target: windows_x64 }
          - { os: macos-latest, target: macos_arm64 }
          - { os: macos-latest, target: macos_x64 }
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install NSGo CLI
        run: go install "github.com/nsgo-dev/nsgo/cmd/nsgo@$(go list -m -f '{{.Version}}' github.com/nsgo-dev/nsgo)"

      - name: Ensure the Windows installer compiler is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build native installers
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          nsgo build -target "$TARGET" -version "$version"
          base="dist/releases/owl-dictionary-$version-${TARGET/_/-}"
          case "$TARGET" in
            linux_*)   files=("$base.deb" "$base.pkg.tar.gz" "$base.AppImage") ;;
            macos_*)   files=("$base.dmg") ;;
            windows_*) files=("$base-setup.exe") ;;
          esac
          mkdir -p artifacts
          cp "${files[@]}" artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: owl-desktop-${{ matrix.target }}
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 7

  upload-release:
    name: Attach packages and checksums to the draft
    needs: [build-backend, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: owl-*
          path: packages
          merge-multiple: true
      - name: Upload packages
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./* "$RUNNER_TEMP/SHA256SUMS"
