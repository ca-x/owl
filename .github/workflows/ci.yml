name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Native client on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Exercise the native reading and connection windows
        shell: bash
        run: |
          go install "github.com/nsgo-dev/nsgo/cmd/nsgo@$(go list -m -f '{{.Version}}' github.com/nsgo-dev/nsgo)"
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y libgtk-4-1 xvfb xauth
              GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a nsgo test -target linux ;;
            macOS)   nsgo test -target macos ;;
            Windows) nsgo test -target windows ;;
          esac

  test:
    name: Backend, embedded frontend, and docker checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build embedded frontend assets
        working-directory: frontend
        run: pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          check-latest: true

      - name: Verify backend
        working-directory: backend
        env:
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: off
        run: |
          go test ./...
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify single image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
